<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Image with Aspect Ratio · ODD Core</title>
  <link rel="stylesheet" href="../../odd-core.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="oddScope">
  <main class="oddDemo">
    <form class="oddStack" data-odd-component="responsive-image-with-aspect-ratio" data-odd-version="1.0.1" data-odd-name="responsive-image">
      <header class="oddStack">
        <h1 class="oddHeading">Responsive image</h1>
        <p class="oddMuted">Choose a crop ratio and fit. The image keeps its dimensions reserved while it loads.</p>
      </header>
      <div class="oddResponsiveImage__options">
        <fieldset>
          <legend class="oddLabel">Aspect ratio</legend>
          <label><input type="radio" data-odd-field="aspect-ratio" value="4:3" checked> <span>4:3</span></label>
          <label><input type="radio" data-odd-field="aspect-ratio" value="1:1"> <span>1:1</span></label>
          <label><input type="radio" data-odd-field="aspect-ratio" value="16:9"> <span>16:9</span></label>
        </fieldset>
        <fieldset>
          <legend class="oddLabel">Image fit</legend>
          <label><input type="radio" data-odd-field="object-fit" value="cover" checked> <span>Cover</span></label>
          <label><input type="radio" data-odd-field="object-fit" value="contain"> <span>Contain</span></label>
        </fieldset>
      </div>
      <figure class="oddResponsiveImage">
        <div class="oddResponsiveImage__frame" data-odd-part="frame">
          <img data-odd-part="image" src="assets/landscape.svg" width="640" height="480" loading="lazy" alt="Geometric mountain landscape">
          <div class="oddResponsiveImage__fallback" data-odd-part="fallback" hidden role="img" aria-label="Geometric mountain landscape unavailable">Image unavailable</div>
        </div>
        <figcaption class="oddMuted">Original geometric landscape</figcaption>
      </figure>
      <div class="oddRow">
        <button type="reset" class="oddButton oddSecondary">Reset options</button>
        <p class="oddStatus" data-odd-part="status" role="status" aria-live="polite"></p>
      </div>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
