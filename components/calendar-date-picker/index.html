<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendar Date Picker · ODD Core</title><link rel="stylesheet" href="../../odd-core.css"></head><body class="oddScope"><main class="oddDemo"><div class="oddForm" data-odd-component="calendar-date-picker" data-odd-version="1.0.0"><div class="oddCalendar oddStack">
<div class="oddRow oddCalendarHeader">
<button type="button" class="oddButton oddSecondary" data-odd-action="prev" aria-label="Previous month">‹</button><strong data-odd-part="month" aria-live="polite"></strong><button type="button" class="oddButton oddSecondary" data-odd-action="next" aria-label="Next month">›</button>
</div>
<table role="grid" aria-label="Choose date">
<thead><tr>
<th scope="col" abbr="Sunday">S</th>
<th scope="col" abbr="Monday">M</th>
<th scope="col" abbr="Tuesday">T</th>
<th scope="col" abbr="Wednesday">W</th>
<th scope="col" abbr="Thursday">T</th>
<th scope="col" abbr="Friday">F</th>
<th scope="col" abbr="Saturday">S</th>
</tr></thead>
<tbody data-odd-part="days"></tbody>
</table>
<input type="hidden" name="date"><p class="oddStatus" data-odd-part="status" role="status">Select a date</p>
</div></div></main><script src="script.js"></script></body></html>
