<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dual Range Slider · ODD Core</title><link rel="stylesheet" href="../../odd-core.css"></head><body class="oddScope"><main class="oddDemo"><div class="oddForm" data-odd-component="dual-range-slider" data-odd-version="1.0.0"><form class="oddStack"><fieldset class="oddStack">
<legend>Price range</legend>
<label class="oddLabel"><span>Lower value</span><input type="range" name="minimum" min="0" max="100" value="20" data-odd-part="low"></label><label class="oddLabel"><span>Upper value</span><input type="range" name="maximum" min="0" max="100" value="80" data-odd-part="high"></label><div class="oddRangeTrack" aria-hidden="true"><span data-odd-part="fill"></span></div>
<div class="oddRow">
<label class="oddLabel"><span>Minimum</span><input type="number" class="oddInput" min="0" max="100" value="20" data-odd-part="low-number"></label><label class="oddLabel"><span>Maximum</span><input type="number" class="oddInput" min="0" max="100" value="80" data-odd-part="high-number"></label>
</div>
<output data-odd-part="range">20 – 80</output>
</fieldset></form></div></main><script src="script.js"></script></body></html>
